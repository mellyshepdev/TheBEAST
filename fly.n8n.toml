app = "beast-n8n"
primary_region = "ams"

[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "n8n_data"
  destination = "/home/node/.n8n"

[env]
  N8N_PORT = "5678"
  N8N_PROTOCOL = "https"
  N8N_HOST = "beast-n8n.fly.dev"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
